spring.application.name=confirmacao-presenca
# Configuração da Conexão JDBC
spring.datasource.url=jdbc:mysql://localhost:3306/rsvp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate (Cria/atualiza tabelas automaticamente no desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true